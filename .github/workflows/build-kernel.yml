name: Build Kernel (Galaxy A52 4G - a52q)

on:
  workflow_dispatch:
    inputs:
      sukisu_enabled:
        description: 'Build vendored SukiSU Ultra builtin (off = diagnostic root-free build)'
        required: true
        type: boolean
        default: true
  push:
    branches:
      - lineage-23.2
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'

permissions:
  contents: read

jobs:
  build:
    name: Compile Galaxy A52 4G kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      ROOT_ENABLED: ${{ github.event_name == 'push' && 'true' || inputs.sukisu_enabled && 'true' || 'false' }}
      # Exact stock ROM toolchain: r563880c, build 14054515, clang/LLD 21.0.0.
      # https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+/531a564ba5426707dee226eccb19f104a7af5a5f
      CLANG_COMMIT: 531a564ba5426707dee226eccb19f104a7af5a5f
      ANYKERNEL_COMMIT: 020dfeccf9d7e962a48400fc94d3e451df92eead

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex openssl libssl-dev libelf-dev libncurses-dev \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git zip curl python3 rsync cpio

      - name: Setup pinned stock-ROM AOSP clang r563880c
        run: |
          mkdir -p toolchain/clang diagnostics
          archive="$RUNNER_TEMP/clang-r563880c.tar.gz"
          url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${CLANG_COMMIT}/clang-r563880c.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 900 \
            --output "$archive" "$url"
          tar -xzf "$archive" -C toolchain/clang
          test -x toolchain/clang/bin/clang
          test -x toolchain/clang/bin/ld.lld
          grep -Fx '21.0.0' toolchain/clang/AndroidVersion.txt
          grep -Fx 'based on r563880c' toolchain/clang/AndroidVersion.txt
          test -f toolchain/clang/manifest_14054515.xml
          {
            printf 'clang_source=%s\n' "$url"
            sha256sum "$archive"
            toolchain/clang/bin/clang --version
            toolchain/clang/bin/ld.lld --version
            toolchain/clang/bin/llvm-objcopy --version
            dpkg-query -W binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
              gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          } > diagnostics/toolchain.txt
          cat diagnostics/toolchain.txt
          rm -f "$archive"

      - name: Configure, compile and validate kernel
        run: bash scripts/build-a52q.sh

      - name: Package Image.gz with AnyKernel3
        run: |
          git init AnyKernel3
          git -C AnyKernel3 remote add origin https://github.com/osm0sis/AnyKernel3.git
          git -C AnyKernel3 fetch --depth=1 origin "$ANYKERNEL_COMMIT"
          git -C AnyKernel3 checkout --detach FETCH_HEAD
          test "$(git -C AnyKernel3 rev-parse HEAD)" = "$ANYKERNEL_COMMIT"
          # The upstream example contains Galaxy Nexus ramdisk patches.
          # Replace it with a script that only replaces the boot kernel.
          cat > AnyKernel3/anykernel.sh <<'AK3'
          ### AnyKernel3 script for Galaxy A52 4G (a52q)
          properties() { '
          kernel.string=SukiSU Ultra builtin for Samsung Galaxy A52 4G (a52q)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=a52q
          device.name2=a52
          device.name3=SM-A525F
          device.name4=SM-A525M
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }
          BLOCK=boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=0;
          NO_MAGISK_CHECK=1;
          . tools/ak3-core.sh;
          split_boot;
          flash_boot;
          AK3
          # hdr v2 boot dtb and board-specific dtbo stay from the installed ROM.
          rm -f AnyKernel3/Image.gz-dtb AnyKernel3/Image-dtb AnyKernel3/dtb \
            AnyKernel3/dtbo.img AnyKernel3/Image
          test -s out/arch/arm64/boot/Image.gz
          cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          mode=SukiSU-builtin
          if [ "$ROOT_ENABLED" = false ]; then
            mode=no-root
            sed -i 's/^kernel.string=.*/kernel.string=Diagnostic no-root kernel for Samsung Galaxy A52 4G (a52q)/' AnyKernel3/anykernel.sh
          fi
          zip_name="AnyKernel3-a52q-${mode}-${GITHUB_SHA:0:8}.zip"
          (
            cd AnyKernel3
            zip -r9 "../$zip_name" . -x '.git/*' '.github/*' README.md '*placeholder'
          )
          python3 verify-ak3.py "$zip_name"
          sha256sum "$zip_name" > "$zip_name.sha256"
          printf 'ZIP_NAME=%s\n' "$zip_name" >> "$GITHUB_ENV"
          printf 'anykernel_commit=%s\n' "$ANYKERNEL_COMMIT" >> diagnostics/build.txt

      - name: Upload flashable kernel ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
          if-no-files-found: error

      - name: Upload configuration and build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a52q-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            diagnostics/
            out/.config
            out/include/config/kernel.release
            out/include/generated/utsrelease.h
            out/System.map
            out/Module.symvers
            out/vmlinux
          include-hidden-files: true
          if-no-files-found: warn
